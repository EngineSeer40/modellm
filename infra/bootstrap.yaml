AWSTemplateFormatVersion: '2010-09-09'
Description: One-time ModeLLM image repository bootstrap (operator action)
Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Expire untagged build layers after 7 days; keep tagged rollback releases","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},"action":{"type":"expire"}}]}'
Outputs:
  RepositoryUri: {Value: !GetAtt Repository.RepositoryUri}
  RepositoryArn: {Value: !GetAtt Repository.Arn}